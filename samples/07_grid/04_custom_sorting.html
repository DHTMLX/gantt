<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Custom sorting function</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>
	<script src="../common/testdata_public.js"></script>
</head>

<body style="margin: 0">
<div id="gantt_here" style="width:100%; height:100vh;"></div>

<script>
	var direction = false;

	gantt.plugins({ toolbar: true });
	gantt.config.toolbar = [
		{ id: "sort_by_users_count", label: "Sort by the number of users" }
	];
	gantt.attachEvent("onToolbarItemClick", function() {
		direction = !direction;
		gantt.sort(sortHolders);
	});

	function sortHolders(a, b) {
		a = a.users.length;
		b = b.users.length;

		if (direction) {
			return a > b ? 1 : (a < b ? -1 : 0);
		} else {
			return a > b ? -1 : (a < b ? 1 : 0);
		}
	}

	gantt.config.columns = [
		{name: "text", label: "Task name", tree: true, resize: true, width: 160},
    { name: "start_date", label: "Start time", resize: true, width: 100 },
    { name: "duration", label: "Duration", resize: true, width: 50 },
    {
				name: "users", label: "Users", width: 120, resize: true, align: "center", template: function (task) {
					if (task.users && Array.isArray(task.users)){
						return task.users.join();
					} else {
						return "";
					}
        }
    },
    { name: "add", label: "", width: 44 }
	];

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(users_data);
</script>
</body>
