<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Basic filtering</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<script src="../common/testdata_public.js"></script>

	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>


<script>

	gantt.plugins({ toolbar: true });
	gantt.config.toolbar = [
		{ id: "1", comp: "toggle", label: "High priority", pressed: true },
		{ id: "2", comp: "toggle", label: "Normal priority" },
		{ id: "3", comp: "toggle", label: "Low priority" }
	];

	const activePriorities = new Set(["1"]);
	gantt.attachEvent("onToolbarItemChange", function(id, pressed) {
		if (pressed) {
			activePriorities.add(id);
		} else {
			activePriorities.delete(id);
		}
		gantt.render();
	});

	function hasPriority(parent, priority) {
		if (gantt.getTask(parent).priority == priority)
			return true;

		var child = gantt.getChildren(parent);
		for (var i = 0; i < child.length; i++) {
			if (hasPriority(child[i], priority))
				return true;
		}
		return false;
	}

	gantt.attachEvent("onBeforeTaskDisplay", function(id) {
		return Array.from(activePriorities).some(priority => hasPriority(id, priority));
	});

	gantt.config.columns = [
		{name: "text", label: "Task name", tree: true, resize: true, align: "center", width: 160},
		{name: "start_date", label: "Start time", resize: true, align: "center"},
		{
			name: "priority", label: "Priority", align: "center", template: function (obj) {
				if (obj.priority == 1) return "High";
				if (obj.priority == 2) return "Normal";
				return "Low";
			}
		}
	];
	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(users_data);

</script>
</body>
