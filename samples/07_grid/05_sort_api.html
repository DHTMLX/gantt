<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Using sorting methods</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>
	<script src="../common/testdata_public.js"></script>
</head>

<body style="margin: 0">
<div id="gantt_here" style="width:100%; height:100vh;"></div>

<script>
	var p_direction = false;
	var n_direction = false;

	gantt.plugins({ toolbar: true });
	gantt.config.toolbar = [
		{ id: "sort_by_priority", label: "Sort by priority" },
		{ id: "sort_by_name", label: "Sort by task name" }
	];
	gantt.attachEvent("onToolbarItemClick", function(id) {
		if (id === "sort_by_priority") {
			sortByPriority();
		} else if (id === "sort_by_name") {
			sortByName();
		}
	});

	function sortByPriority() {
		if (p_direction) {
			gantt.sort("priority", false);
		} else {
			gantt.sort("priority", true);
		}
		p_direction = !p_direction;
	}

	function sortByName() {
		if (n_direction) {
			gantt.sort("text", false);
		} else {
			gantt.sort("text", true);
		}
		n_direction = !n_direction;
	}

	gantt.config.columns = [
		{name: "text", label: "Task name", tree: true, resize: true, align: "center", width: 160},
		{name: "start_date", label: "Start time", resize: true, align: "center"},
		{
			name: "priority", label: "Priority", resize: true, align: "center", template: function (obj) {
				if (obj.priority == 1) return "High";
				if (obj.priority == 2) return "Normal";
				return "Low";
			}
		},
		{ name: "add", label: "", width: 44 }
	]

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(users_data);
</script>
</body>
