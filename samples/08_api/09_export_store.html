<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Export data: store online</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>

	<script src="../common/testdata_public.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>
<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>

<script>
	function show_result(info) {
		if (!info)
			gantt.message({
				text: "Server error",
				type: "error",
				expire: -1
			});
		else
			gantt.message({
				text: "Stored at <a href='" + info.url + "'>export.dhtlmx.com</a>",
				expire: -1
			});
	}

	gantt.plugins({
		toolbar: true,
		export_api: true,
	});


	gantt.templates.task_text = function (s, e, task) {
		return "Export " + task.text;
	};

	gantt.config.columns[0].template = function (obj) {
		return obj.text + " -";
	};

	gantt.config.toolbar = [
		{ id: "export_to_pdf", label: "Export to PDF" },
		{ id: "export_to_png", label: "Export to PNG" },
		{ id: "export_to_excel", label: "Export to Excel" },
		{ id: "export_to_ical", label: "Export to iCal" }
	];
	const toolbarActions = {
		export_to_pdf: () => gantt.exportToPDF({ callback:show_result }),
		export_to_png: () => gantt.exportToPNG({ callback:show_result }),
		export_to_excel: () => gantt.exportToExcel({ callback:show_result }),
		export_to_ical: () => gantt.exportToICal({ callback:show_result })
	};
	gantt.attachEvent("onToolbarItemClick", function(id) {
		toolbarActions[id]();
	});

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(demo_tasks);
</script>
</body>
