<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Export data from Gantt</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>

	<script src="../common/testdata_public.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>


<div id="gantt_here" style='width:100%; height:100%;'></div>
<script>
	gantt.plugins({
		toolbar: true,
		export_api: true,
	});
	gantt.config.grid_width = 440;

	gantt.templates.task_text = function (s, e, task) {
		return "Export " + task.text;
	}
	gantt.config.columns[0].template = function (obj) {
		return obj.text + " - <b>" + obj.progress*100 + "%</b>";
	}
	gantt.config.toolbar = [
		{ id: "export_to_pdf", label: "Export to PDF" },
		{ id: "export_to_png", label: "Export to PNG" },
		{ id: "export_dark", label: "Export :: Dark" },
		{ id: "export_broadway", label: "Export :: Broadway" },
		{ id: "export_skyblue", label: "Export :: Skyblue" },
		{ id: "export_material", label: "Export :: Material" }
	];
	const toolbarActions = {
		export_to_pdf: () => gantt.exportToPDF(),
		export_to_png: () => gantt.exportToPNG(),
		export_dark: () => gantt.exportToPNG({ skin:"dark" }),
		export_broadway: () => gantt.exportToPDF({ skin:"broadway" }),
		export_skyblue: () => gantt.exportToPDF({ skin:"skyblue" }),
		export_material: () => gantt.exportToPNG({ skin:"material" })
	};
	gantt.attachEvent("onToolbarItemClick", function(id) {
		toolbarActions[id]();
	});

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(demo_tasks);
</script>
</body>
