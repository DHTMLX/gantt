<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Export with custom styles</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>

	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/customstyles.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>

	<script src="../common/testdata_public.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>

<script>

	gantt.plugins({
		toolbar: true,
		export_api: true,
	});

	gantt.config.columns = [
		{name: "text", label: "Task name", tree: true, resize: true, width: "*"},
		{name: "start_date", label: "Start time", resize: true, align: "center"},
		{
			name: "priority", label: "Priority", resize: true, align: "center", template: function (obj) {
				if (obj.priority == 1) {
					return "High"
				}
				if (obj.priority == 2) {
					return "Medium"
				}
				return "Low"
			}
		}
	];

	gantt.templates.task_class = function (start, end, task) {
		switch (task.priority) {
			case "1":
				return "high";
				break;
			case "2":
				return "medium";
				break;
			case "3":
				return "low";
				break;
		}
	};

	gantt.config.toolbar = [
		{ id: "export_to_pdf", label: "Export to PDF" },
		{ id: "export_to_png", label: "Export to PNG" }
	];
	const toolbarActions = {
		export_to_pdf: () => exportGantt('pdf'),
		export_to_png: () => exportGantt('png')
	};
	gantt.attachEvent("onToolbarItemClick", function(id) {
		toolbarActions[id]();
	});

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(users_data);

	function exportGantt(mode) {
		if (mode == "png"){
			gantt.exportToPNG({
				header: '<link rel="stylesheet" href="http://docs.dhtmlx.com/gantt/samples/common/customstyles.css">'
			});
		}else if (mode == "pdf"){
			gantt.exportToPDF({
				header: '<link rel="stylesheet" href="http://docs.dhtmlx.com/gantt/samples/common/customstyles.css">'
			});
		}
	}
</script>
</body>
