<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Export data : MS Project, PrimaveraP6, Excel &amp; iCal</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>

	<script src="../common/testdata_public.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>

<script>

	gantt.plugins({
		toolbar: true,
		export_api: true,
	});

	gantt.config.auto_types = true;
	gantt.config.fit_tasks = true;
	gantt.templates.task_text = function (s, e, task) {
		return "Export " + task.text;
	};

	gantt.config.columns[0].template = function (obj) {
		return obj.text;
	};

	gantt.config.toolbar = [
		{ id: "export_to_ms_project", label: "Export to MS Project" },
		{ id: "export_to_primaverap6", label: "Export to PrimaveraP6" },
		{ id: "export_to_excel", label: "Export to Excel" },
		{ id: "export_to_ical", label: "Export to iCal" }
	];
	const toolbarActions = {
		export_to_ms_project: () => gantt.exportToMSProject({skip_circular_links: false}),
		export_to_primaverap6: () => gantt.exportToPrimaveraP6({skip_circular_links: false}),
		export_to_excel: () => gantt.exportToExcel(),
		export_to_ical: () => gantt.exportToICal()
	};
	gantt.attachEvent("onToolbarItemClick", function(id) {
		toolbarActions[id]();
	});

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(demo_tasks);
</script>
</body>
