<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-type" content="text/html; charset=utf-8">
<title>Show empty state screen</title>
<script src="../../codebase/dhtmlxgantt.js"></script>
<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
<link rel="stylesheet" href="../common/sample_toolbar.css">
<script src="../common/sample_toolbar.js"></script>

<style>
  html,
  body {
    height: 100%;
    padding: 0px;
    margin: 0px;
    overflow: hidden;
  }
</style>

</head>

<body>

<div id="gantt_here" style="width: 100%; height: 100%;position: relative;"></div>

  <script>

  gantt.plugins({ toolbar: true });
  gantt.config.toolbar = { items: [{ id: "toggle-grid", comp: "toggle", label: "Show grid", pressed: true }] };
  gantt.attachEvent("onToolbarItemChange", function(id, value) {
    gantt.config.show_grid = value;
    gantt.render();
  });
  gantt.config.show_empty_state = true;

  gantt.config.start_date = new Date(2027, 3, 29);
  gantt.config.end_date = new Date(2027, 4, 30);
  gantt.config.layout = withSampleToolbar(gantt.config.layout);
  gantt.init("gantt_here");

  gantt.attachEvent("onLightboxSave", function(id, task, is_new){
    let repaint = false;
    if (+task.start_date <= +gantt.config.start_date){
      gantt.config.start_date = gantt.date.add(task.start_date, -1, "day");
      repaint = true;
    }
    if (+gantt.config.end_date <= +task.end_date){
      gantt.config.end_date = gantt.date.add(task.end_date, 1, "day");
      repaint = true;
    }
    if (repaint){
      gantt.render();
    }

    return true;
  })


</script>
</body>
