<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Dynamically move task text to the right side</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">

	<script src="../common/testdata.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}

		.weekend {
			background: var(--dhx-gantt-base-colors-background-alt);
		}


	</style>
</head>

<body>
<div id="gantt_here" style='width:100%; height:100%;'></div>


<script>
	gantt.setSkin("meadow");
	gantt.message({
		text: "Task description will be displayed aside if the width is not enough to fit it",
		expire: -1
	});
	gantt.message({
		text: "Try expanding <b>Integrate System</b> task",
		expire: -1
	});

	gantt.config.row_height = 24;
	gantt.config.bar_height = 19;
	gantt.config.min_column_width = 50;

	gantt.templates.timeline_cell_class = function (item, date) {
		if (date.getDay() == 0 || date.getDay() == 6) {
			return "weekend";
		}
	};

	gantt.config.columns = [
		{name: "text", label: "Task name", width: "*", resize: true, tree: true},
		{name: "start_date", label: "Start time", resize: true, align: "center", width: 90},
		{name: "duration", label: "Duration", resize: true, align: "center", width: 60},
		{name: "add", label: "", width: 44}
	];

	gantt.config.grid_width = 390;
	gantt.config.date_grid = "%F %d";
	gantt.config.scale_height = 60;
	gantt.config.scales = [
		{unit: "week", step: 1, format: "Week #%W"},
		{unit: "day", step: 1, format: "%d %M", css: function (date) {
			if (date.getDay() == 0 || date.getDay() == 6) {
				return "weekend";
			}
		}}
	];


	(function () {
		gantt.config.font_width_ratio = 7;
		gantt.templates.leftside_text = function leftSideTextTemplate(start, end, task) {
			if (getTaskFitValue(task) === "left") {
				return task.text;
			}
			return "";
		};
		gantt.templates.rightside_text = function rightSideTextTemplate(start, end, task) {
			if (getTaskFitValue(task) === "right") {
				return task.text;
			}
			return "";
		};
		gantt.templates.task_text = function taskTextTemplate(start, end, task) {
			if (getTaskFitValue(task) === "center") {
				return task.text;
			}
			return "";
		};

		function getTaskFitValue(task) {
			var taskStartPos = gantt.posFromDate(task.start_date),
				taskEndPos = gantt.posFromDate(task.end_date);

			var width = taskEndPos - taskStartPos;
			var textWidth = (task.text || "").length * gantt.config.font_width_ratio;

			if (width < textWidth) {
				var ganttLastDate = gantt.getState().max_date;
				var ganttEndPos = gantt.posFromDate(ganttLastDate);
				if (ganttEndPos - taskEndPos < textWidth) {
					return "left"
				}
				else {
					return "right"
				}
			}
			else {
				return "center";
			}
		}
	})();
	gantt.init("gantt_here");
	gantt.parse({
		data: [
			{id: 1, text: "Office itinerancy", type: "project", progress: 0.4, open: false, start_date: "04-04-2027 00:00", duration: 17, end_date: "21-04-2027 00:00", parent: 0},
			{id: 2, text: "Office facing", type: "project", start_date: "04-04-2027 00:00", duration: 8, progress: 0.6, parent: "1", open: true, end_date: "12-04-2027 00:00"},
			{id: 5, text: "Interior office", start_date: "04-04-2027 00:00", duration: 7, parent: "2", progress: 0.6, open: true, end_date: "11-04-2027 00:00"},
			{id: 6, text: "Air conditioners check", start_date: "05-04-2027 00:00", duration: 7, parent: "2", progress: 0.6, open: true, end_date: "12-04-2027 00:00"},
			{id: 3, text: "Furniture installation", type: "project", start_date: "13-04-2027 00:00", duration: 8, parent: "1", progress: 0.6, open: true, end_date: "21-04-2027 00:00"},
			{id: 7, text: "Workplaces preparation", start_date: "13-04-2027 00:00", duration: 8, parent: "3", progress: 0.6, open: true, end_date: "21-04-2027 00:00"},
			{id: 4, text: "The employee relocation", type: "project", start_date: "16-04-2027 00:00", duration: 5, parent: "1", progress: 0.5, open: true, end_date: "21-04-2027 00:00"},
			{id: 8, text: "Preparing workplaces", start_date: "16-04-2027 00:00", duration: 5, parent: "4", progress: 0.5, open: true, end_date: "21-04-2027 00:00"},
			{id: 9, text: "Workplaces importation", start_date: "16-04-2027 00:00", duration: 4, parent: "4", progress: 0.5, open: true, end_date: "20-04-2027 00:00"},
			{id: 10, text: "Workplaces exportation", start_date: "16-04-2027 00:00", duration: 3, parent: "4", progress: 0.5, open: true, end_date: "19-04-2027 00:00"},
			{id: 11, text: "Product launch", type: "project", progress: 0.6, open: true, start_date: "04-04-2027 00:00", duration: 18, end_date: "22-04-2027 00:00", parent: 0},
			{id: 12, text: "Perform Initial testing", start_date: "05-04-2027 00:00", duration: 5, parent: "11", progress: 1, open: true, end_date: "10-04-2027 00:00"},
			{id: 13, text: "Development", type: "project", start_date: "05-04-2027 00:00", duration: 14, parent: "11", progress: 0.5, open: true, end_date: "19-04-2027 00:00"},
			{id: 17, text: "Develop System", start_date: "05-04-2027 00:00", duration: 1, parent: "13", progress: 0.4785714285714286, open: true, end_date: "06-04-2027 00:00"},
			{id: 25, text: "Beta Release", start_date: "08-04-2027 00:00", type: "milestone", parent: "13", progress: 0, open: true, end_date: "08-04-2027 00:00", duration: 0},
			{id: 18, text: "Integrate System", start_date: "10-04-2027 00:00", duration: 1, parent: "13", progress: 0.8, open: true, end_date: "11-04-2027 00:00"},
			{id: 19, text: "Test", start_date: "12-04-2027 00:00", duration: 4, parent: "13", progress: 0.2, open: true, end_date: "16-04-2027 00:00"},
			{id: 20, text: "Marketing", start_date: "17-04-2027 00:00", duration: 2, parent: "13", progress: 0, open: true, end_date: "19-04-2027 00:00"},
			{id: 14, text: "Analysis", start_date: "04-04-2027 00:00", duration: 6, parent: "11", progress: 0.8, open: true, end_date: "10-04-2027 00:00"},
			{id: 15, text: "Design", type: "project", start_date: "05-04-2027 00:00", duration: 5, parent: "11", progress: 0.2, open: false, end_date: "10-04-2027 00:00"},
			{id: 21, text: "Design database", start_date: "05-04-2027 00:00", duration: 4, parent: "15", progress: 0.5, open: true, end_date: "09-04-2027 00:00"},
			{id: 22, text: "Software design", start_date: "05-04-2027 00:00", duration: 4, parent: "15", progress: 0.1, open: true, end_date: "09-04-2027 00:00"},
			{id: 23, text: "Interface setup", start_date: "05-04-2027 00:00", duration: 5, parent: "15", progress: 0, open: true, end_date: "10-04-2027 00:00"},
			{id: 16, text: "Documentation creation", start_date: "07-04-2027 00:00", duration: 1, parent: "11", progress: 0, open: true, end_date: "08-04-2027 00:00"},
			{id: 24, text: "Release v1.0", start_date: "22-04-2027 00:00", type: "milestone", parent: "11", progress: 0, open: true, end_date: "22-04-2027 00:00", duration: 0}
		],
		links: [
			{id: "1", source: "1", target: "2", type: "1"},
			{id: "2", source: "2", target: "3", type: "0"},
			{id: "3", source: "3", target: "4", type: "0"},
			{id: "4", source: "2", target: "5", type: "2"},
			{id: "5", source: "2", target: "6", type: "2"},

			{id: "8", source: "4", target: "9", type: "2"},
			{id: "9", source: "4", target: "10", type: "2"},
			{id: "10", source: "11", target: "12", type: "1"},
			{id: "11", source: "11", target: "13", type: "1"},
			{id: "12", source: "11", target: "14", type: "1"},
			{id: "13", source: "11", target: "15", type: "1"},
			{id: "14", source: "11", target: "16", type: "1"},
			{id: "15", source: "13", target: "17", type: "1"},
			{id: "16", source: "17", target: "25", type: "0"},
			{id: "17", source: "18", target: "19", type: "0"},
			{id: "18", source: "19", target: "20", type: "0"},
			{id: "19", source: "15", target: "21", type: "2"},

			{id: "22", source: "13", target: "24", type: "0"},
			{id: "23", source: "25", target: "18", type: "0"}
		]
	});

</script>
