<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Dynamic scales</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<script src="../common/sample_toolbar.js"></script>

	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">

	<script src="../common/testdata_public.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>

<div id="gantt_here" style='width:100%; height:100%;'></div>

<script>
	var zoomConfig = {
		levels: [
			{
				name:"day",
				scale_height: 27,
				min_column_width:80,
				scales:[
					{unit: "day", step: 1, format: "%d %M"}
				]
			},
			{
				name:"week",
				scale_height: 50,
				min_column_width:50,
				scales:[
					{unit: "week", step: 1, format: function (date) {
						var dateToStr = gantt.date.date_to_str("%d %M");
						var endDate = gantt.date.add(date, 7 - date.getDay(), "day");
						var weekNum = gantt.date.date_to_str("%W")(date);
						return "#" + weekNum + ", " + dateToStr(date) + " - " + dateToStr(endDate);
					}},
					{unit: "day", step: 1, format: "%j %D"}
				]
			},
			{
				name:"month",
				scale_height: 50,
				min_column_width:120,
				scales:[
					{unit: "month", format: "%F, %Y"},
					{unit: "week", format: "Week #%W"}
				]
			},
			{
				name:"quarter",
				height: 50,
				min_column_width:90,
				scales:[
					{unit: "month", step: 1, format: "%M"},
					{
						unit: "quarter", step: 1, format: function (date) {
							var dateToStr = gantt.date.date_to_str("%M");
							var endDate = gantt.date.add(date, 2 - date.getMonth() % 3, "month");
							return dateToStr(date) + " - " + dateToStr(endDate);
						}
					}
				]
			},
			{
				name:"year",
				scale_height: 50,
				min_column_width: 30,
				scales:[
					{unit: "year", step: 1, format: "%Y"}
				]
			}
		]
	};

	gantt.ext.zoom.init(zoomConfig);
	gantt.ext.zoom.setLevel("year");

	gantt.plugins({ toolbar: true });

	gantt.config.toolbar = [
		{ id: "zoom_in_step", label: "Zoom In" },
		{ id: "zoom_out_step", label: "Zoom Out" },
		{
			id: "scale",
			comp: "segmented",
			value: "year",
			options: [
				{ key: "day", label: "Day scale" },
				{ key: "week", label: "Week scale" },
				{ key: "month", label: "Month scale" },
				{ key: "quarter", label: "Quarter scale" },
				{ key: "year", label: "Year scale" }
			]
		}
	];
	gantt.attachEvent("onToolbarItemClick", function(id) {
		if (id === "zoom_in_step") gantt.ext.zoom.zoomIn();
		if (id === "zoom_out_step") gantt.ext.zoom.zoomOut();
	});
	gantt.attachEvent("onToolbarItemChange", function(id, value) {
		if (id === "scale") gantt.ext.zoom.setLevel(value);
	});

	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here", new Date(2026, 7, 31), new Date(2027, 9, 31));
	gantt.parse(demo_tasks);

	gantt.ext.zoom.attachEvent("onAfterZoom", function (level, config) {
		gantt.ext.toolbar.setValue("scale", config.name);
	});

</script>
</body>
