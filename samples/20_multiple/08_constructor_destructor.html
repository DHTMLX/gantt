<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Using gantt constructor and destructor</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<style>
		html, body {
			height: 100%;
			margin: 0px;
			padding: 0px;
		}
		body {
			display: flex;
			flex-direction: column;
		}

		#gantt_here {
			flex: 1;
			min-height: 0;
		}
	</style>

	<script>

		window.addEventListener("DOMContentLoaded", function(){
			var ganttInstance;
			function toggleGantt() {
				if(ganttInstance) {
					ganttInstance.destructor();
					ganttInstance = null;

					toolbar.updateItem("toggle_gantt", { label: "Create gantt" });
				}else{
					ganttInstance = Gantt.getGanttInstance({
						container: "gantt_here",
						data: {
							tasks: [
								{ id: 1, text: "Project #1", start_date: "03-04-2027", duration: 18,
									progress: 0.4, open: true
								},
								{ id: 2, text: "Task #1", start_date: "04-04-2027", duration: 8,
									progress: 0.6, parent: 1
								},
								{ id: 3, text: "Task #2", start_date: "13-04-2027", duration: 8,
									progress: 0.6, parent: 1
								}
							],
							links: [
								{id: 1, source: 1, target: 2, type: "1"}
							]
						}
					});

					toolbar.updateItem("toggle_gantt", { label: "Destroy gantt" });
				}
				toolbar.getControl("toggle_gantt").focus();
			}

			const toolbar = gantt.ext.ui.createToolbar({
				items: [{ id: "toggle_gantt", label: "Create gantt" }],
				onItemClick: function (id) {
					if (id === "toggle_gantt") { toggleGantt(); }
				}
			});
			toolbar.mount(document.getElementById("constructor_toolbar"));
		})
	</script>
</head>


<body>
	<div id="constructor_toolbar" class="sample-toolbar-host"></div>
	<div id="gantt_here"></div>
</body>
