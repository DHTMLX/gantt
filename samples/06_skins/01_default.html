<!DOCTYPE html>

<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Default skin</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>

	<script src="../common/testdata.js"></script>
	<style>
		html,
		body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
		.main-content {
			height: 100%;
		}
	</style>
</head>

<body>
<main class="main-content">
	<div id="gantt_here" style='width:100%; height:100%;'></div>
</main>
	<script>
		gantt.plugins({
			quick_info: true,
			toolbar: true
		});
		gantt.config.toolbar = [
			{ id: "show_lightbox", label: "Show Lightbox" },
			{ id: "show_quick_info", label: "Show Quick Info" },
			{ id: "show_message", label: "Show message" },
			{ id: "show_error", label: "Show error" },
			{ id: "show_alert", label: "Show alert" },
			{ id: "show_alert_with_header", label: "Show alert with header" }
		];
		const actions = {
			show_lightbox: () => gantt.createTask(),
			show_quick_info: () => {
				const task = gantt.getTaskByTime()[0];
				if (task) gantt.showQuickInfo(task.id);
			},
			show_message: () => gantt.message({ text: "Some text" }),
			show_error: () => gantt.message({ text: "Some text", type: "error" }),
			show_alert: () => gantt.alert({ text: "Some text" }),
			show_alert_with_header: () => gantt.alert({ text: "Some text", title: "Title" })
		};
		gantt.attachEvent("onToolbarItemClick", function(id, item, event) {
			// An empty chart click would immediately close Quick Info.
			event?.stopPropagation();
			actions[id]();
		});
		gantt.config.layout = withSampleToolbar(gantt.config.layout);
		gantt.init("gantt_here");
		gantt.parse({
			"tasks": [
				{ "id": 11, "text": "Project #1", "type": "project", "progress": 0.6, "open": true },

				{ "id": 12, "text": "Task #1", "start_date": "05-04-2027", "duration": "5", "parent": "11", "progress": 1, "open": true },
				{ "id": 13, "text": "Task #2", "start_date": "05-04-2027", "type": "project", "parent": "11", "progress": 0.5, "open": true },
				{ "id": 14, "text": "Task #3", "start_date": "04-04-2027", "duration": "6", "parent": "11", "progress": 0.8, "open": true },
				{ "id": 15, "text": "Task #4", "type": "project", "parent": "11", "progress": 0.2, "open": true },
				{ "id": 16, "text": "Final milestone", "start_date": "17-04-2027", "type": "milestone", "parent": "11", "progress": 0, "open": true },

				{ "id": 17, "text": "Task #2.1", "start_date": "05-04-2027", "duration": "2", "parent": "13", "progress": 1, "open": true },
				{ "id": 18, "text": "Task #2.2", "start_date": "08-04-2027", "duration": "3", "parent": "13", "progress": 0.8, "open": true },
				{ "id": 19, "text": "Task #2.3", "start_date": "12-04-2027", "duration": "4", "parent": "13", "progress": 0.2, "open": true },
				{ "id": 20, "text": "Task #2.4", "start_date": "12-04-2027", "duration": "4", "parent": "13", "progress": 0, "open": true },
				{ "id": 21, "text": "Task #4.1", "start_date": "05-04-2027", "duration": "4", "parent": "15", "progress": 0.5, "open": true },
				{ "id": 22, "text": "Task #4.2", "start_date": "05-04-2027", "duration": "4", "parent": "15", "progress": 0.1, "open": true },
				{ "id": 23, "text": "Mediate milestone", "start_date": "16-04-2027", "type": "milestone", "parent": "15", "progress": 0, "open": true }
			],
			"links": [
				{ "id": "10", "source": "11", "target": "12", "type": "1" },
				{ "id": "11", "source": "11", "target": "13", "type": "1" },
				{ "id": "12", "source": "11", "target": "14", "type": "1" },
				{ "id": "13", "source": "11", "target": "15", "type": "1" },
				{ "id": "14", "source": "23", "target": "16", "type": "0" },
				{ "id": "15", "source": "13", "target": "17", "type": "1" },
				{ "id": "16", "source": "17", "target": "18", "type": "0" },
				{ "id": "17", "source": "18", "target": "19", "type": "0" },
				{ "id": "18", "source": "19", "target": "20", "type": "0" },
				{ "id": "19", "source": "15", "target": "21", "type": "2" },
				{ "id": "20", "source": "15", "target": "22", "type": "2" },
				{ "id": "21", "source": "15", "target": "23", "type": "0" }
			]
		});
	</script>
</body>
