<!DOCTYPE html>

<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Readonly lightbox</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">

	<style>
		html,
		body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}

		.readonly, .readonly.odd{
			background: Gainsboro;
		}
		.readonly_bar{
			--dhx-gantt-task-background: SlateGray;
		}


		body {
			display: flex;
			flex-direction: column;
		}

		#gantt_here {
			flex: 1;
			min-height: 0;
		}
	</style>
</head>

<body>

	<div id="readonly_toolbar" class="sample-toolbar-host"></div>

	<div id="gantt_here"></div>
	<script>

		function toggleReadonly() {
			gantt.config.readonly = !gantt.config.readonly;
			gantt.message("Readonly mode: " + gantt.config.readonly);
			gantt.init("gantt_here");
		}

		var tasks = {
			"data": [
				{ "id": "1", "text": "Ordinary task #1", "start_date": "03-04-2027", "duration": 3, "progress": 0.4, "open": true },
				{ "id": "2", "text": "Editable task #2", "editable": true, "start_date": "05-04-2027", "duration": 2, "progress": 0.6 },
				{ "id": "3", "text": "Readonly task #3", "readonly": true, "start_date": "02-04-2027", "duration": 2, "progress": 0.6 },
			],
			"links": [
			]
		}

		gantt.templates.grid_row_class = 
		gantt.templates.task_row_class = function(start, end, task){
			if (gantt.isReadonly(task.id)) {
				return "readonly"
			};
		};
		gantt.templates.task_class = function(start, end, task){
			if (gantt.isReadonly(task.id)) {
				return "readonly_bar"
			};
		};


		gantt.attachEvent("onTaskDblClick", function(id,e){
			gantt.showLightbox(id)
			return true;
		});

		gantt.attachEvent("onLightboxSave", function(id, task, is_new){
			if (gantt.isReadonly(id)){
				gantt.alert("You cannot edit this task");
				return false;
			}

			return true;
		})

		gantt.attachEvent("onLightboxDelete", function(id){
				if (gantt.config.readonly || gantt.isReadonly(id)){
						gantt.alert("You cannot delete this task");
						return false;
				}
				return true;
		});

		gantt.init("gantt_here");
		gantt.parse(tasks);

		const toolbar = gantt.ext.ui.createToolbar({
			items: [{ id: "readonly_mode", label: "Toggle Readonly Mode" }],
			onItemClick: function (id) {
				if (id === "readonly_mode") { toggleReadonly(); }
			}
		});
		toolbar.mount(document.getElementById("readonly_toolbar"));
		gantt.message.position = "bottom";

		gantt.message({
			text: `
				In the read-only mode, you cannot edit tasks. <br>
				But if you use the Gantt API, you can open the lightbox and check the task properties.
			`,
			expire: -1
		})
		toggleReadonly();

	</script>
</body>
