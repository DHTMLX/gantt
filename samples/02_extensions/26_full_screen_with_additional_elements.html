<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Full Screen with additional elements</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>

	<script src="../common/testdata_public.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<style>
		html, body {
			height: 100%;
			width: 100%;
			padding: 0px;
			margin: 0px;
		}
		#myCover {
			width: 700px;
			max-width: 100%;
			height: 600px;
			display: flex;
			flex-direction: column;
		}
		#gantt_here {
			flex: 1;
			min-height: 0;
		}
	</style>
</head>
<body>
	<div id="myCover">
		<div id="fullscreen_toolbar" class="sample-toolbar-host"></div>
		<div id="gantt_here"></div>
	</div>
	<script>
		gantt.plugins({
			fullscreen: true
		});
		gantt.ext.fullscreen.getFullscreenElement = function() {
			return document.getElementById("myCover");
		}
		gantt.init("gantt_here");

		gantt.parse(demo_tasks);

		const toolbar = gantt.ext.ui.createToolbar({
			items: [{ id: "toggle_fullscreen", label: "toggle fullscreen" }],
			onItemClick: function (id) {
				if (id === "toggle_fullscreen") { gantt.ext.fullscreen.toggle(); }
			}
		});
		toolbar.mount(document.getElementById("fullscreen_toolbar"));
	</script>
</body>
