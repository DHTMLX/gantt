<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Reinitialize in another container</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			display: flex;
			flex-direction: column;
		}

		.gantt-container {
			flex: 1;
			overflow: auto;
		}
	</style>
</head>

<body>
	<div id="gantt_here" class="gantt-container"></div>
	<div id="reinit_toolbar" class="sample-toolbar-host"></div>
	<div id="gantt_here2" class="gantt-container"></div>
	<script>
		gantt.init("gantt_here");
		gantt.parse({
			data: [
				{ id: 1, text: "Project #2", start_date: "03-04-2027", duration: 18, progress: 0.4, open: true },
				{ id: 2, text: "Task #1", start_date: "04-04-2027", duration: 8, progress: 0.6, parent: 1 },
				{ id: 3, text: "Task #2", start_date: "13-04-2027", duration: 8, progress: 0.6, parent: 1 }
			],
			links: [
				{ id: 1, source: 1, target: 2, type: "1" },
				{ id: 2, source: 2, target: 3, type: "0" }
			]
		});

		let currentContainer = "gantt_here";
		function reinit() {
			if (currentContainer === "gantt_here") {
				currentContainer = "gantt_here2";
			}
			else {
				currentContainer = "gantt_here";
			}
			gantt.init(currentContainer);
		}

		const toolbar = gantt.ext.ui.createToolbar({
			items: [{ id: "reinit", label: "Reinitialize in another container" }],
			onItemClick: function (id) {
				if (id === "reinit") { reinit(); }
			}
		});
		toolbar.mount(document.getElementById("reinit_toolbar"));
	</script>
</body>
