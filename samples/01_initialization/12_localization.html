<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Localization</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">

	<script src="../common/testdata_public.js"></script>
	<script src="../common/sample_toolbar.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
		#gantt_here {
			width: 100%;
			height: 800px;
			height: 100%;
		}

	</style>
</head>

<body>
<div id="gantt_here"></div>
<script>
	function changeLocale(lang) {
			gantt.i18n.setLocale(lang);
			gantt.render();
	}

	gantt.plugins({ toolbar: true });
	gantt.config.toolbar = { items: [{
		id: "locale", comp: "combo", label: "Current locale:", width: 192,
		placeholder: "Choose locale", value: "fr", options: [
		{ key: '__default__', label: 'Choose locale' },
		{ key: 'af', label: 'Afrikaans' },
		{ key: 'sq', label: 'Albanian' },
		{ key: 'ar', label: 'Arabic' },
		{ key: 'be', label: 'Belarusian' },
		{ key: 'bs', label: 'Bosnian' },
		{ key: 'bg', label: 'Bulgarian' },
		{ key: 'ca', label: 'Catalan' },
		{ key: 'cn', label: 'Chinese (Simplified)' },
		{ key: 'zh_hk', label: 'Chinese (Hong Kong)' },
		{ key: 'zh_tw', label: 'Chinese (Taiwan)' },
		{ key: 'hr', label: 'Croatian' },
		{ key: 'cs', label: 'Czech' },
		{ key: 'da', label: 'Danish' },
		{ key: 'nl', label: 'Dutch' },
		{ key: 'nl_be', label: 'Dutch (Belgium)' },
		{ key: '', label: 'English' },
		{ key: 'et', label: 'Estonian' },
		{ key: 'fi', label: 'Finnish' },
		{ key: 'fr', label: 'French (France)' },
		{ key: 'fr_ca', label: 'French (Canada)' },
		{ key: 'de', label: 'German (Germany)' },
		{ key: 'de_at', label: 'German (Austria)' },
		{ key: 'el', label: 'Greek' },
		{ key: 'he', label: 'Hebrew' },
		{ key: 'hu', label: 'Hungarian' },
		{ key: 'id', label: 'Indonesian' },
		{ key: 'ga', label: 'Irish' },
		{ key: 'it', label: 'Italian' },
		{ key: 'jp', label: 'Japanese' },
		{ key: 'kr', label: 'Korean' },
		{ key: 'lv', label: 'Latvian' },
		{ key: 'lt', label: 'Lithuanian' },
		{ key: 'mk', label: 'Macedonian' },
		{ key: 'ms', label: 'Malay' },
		{ key: 'nb', label: 'Norwegian (Bokmål)' },
		{ key: 'no', label: 'Norwegian (Nynorsk)' },
		{ key: 'fa', label: 'Persian' },
		{ key: 'pl', label: 'Polish' },
		{ key: 'pt', label: 'Portuguese (Portugal)' },
		{ key: 'pt_br', label: 'Portuguese (Brazil)' },
		{ key: 'ro', label: 'Romanian' },
		{ key: 'ru', label: 'Russian' },
		{ key: 'sk', label: 'Slovak' },
		{ key: 'si', label: 'Slovenian' },
		{ key: 'es', label: 'Spanish (Spain)' },
		{ key: 'es_mx', label: 'Spanish (Mexico)' },
		{ key: 'sv', label: 'Swedish' },
		{ key: 'th', label: 'Thai' },
		{ key: 'tr', label: 'Turkish' },
		{ key: 'ua', label: 'Ukrainian' },
		{ key: 'vi', label: 'Vietnamese' }
	] }] };
	gantt.attachEvent("onToolbarItemChange", function(id, value) {
		changeLocale(value === "__default__" ? "" : value);
	});
	gantt.i18n.setLocale("fr");
	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(demo_tasks);

</script>
</body>
