<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Define displayed date range</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">

	<script src="../common/testdata_public.js"></script>
	<script src="../common/sample_toolbar.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
		#gantt_here {
			width: 100%;
			height: 800px;
			height: 100%;
		}


	</style>
</head>
<body>
<div id="gantt_here"></div>
<script>
	gantt.plugins({ toolbar: true });
	gantt.setSkin("meadow");
	gantt.config.scales = [
		{unit: "month", step: 1, format: "%M"},
		{unit: "year", step: 1, format: "%Y"},
		{unit: "day", format: "%d %M"}
	];
	gantt.config.scale_height = 3 * 28;
	gantt.config.start_date = new Date(2027, 6, 31);
	gantt.config.end_date = new Date(2027, 8, 19);
	const range = {
		start: new Date(2027, 6, 31),
		end: new Date(2027, 7, 19)
	};
	gantt.config.toolbar = [
		{ comp: "label", label: "Displayed date range:" },
		{
			id: "start", comp: "datepicker", width: 132, ariaLabel: "Start date", value: range.start,
			config: { format: "%Y-%m-%d", placeholder: "Start date" }
		},
		{
			id: "end", comp: "datepicker", width: 132, ariaLabel: "End date", value: range.end,
			config: { format: "%Y-%m-%d", placeholder: "End date" }
		}
	];
	gantt.attachEvent("onToolbarItemChange", function(id, value) {
		range[id] = value;
		if (!range.start || !range.end || !(range.end > range.start)) {
			return;
		}
		gantt.config.start_date = new Date(range.start);
		gantt.config.end_date = new Date(range.end);
		gantt.render();
	});
	gantt.config.layout = withSampleToolbar(gantt.config.layout);
	gantt.init("gantt_here");
	gantt.parse(demo_tasks);
</script>
</body>
