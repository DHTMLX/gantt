<!DOCTYPE html>
<head>
	<meta http-equiv="Content-type" content="text/html; charset=utf-8">
	<title>Gantt message types</title>
	<script src="../../codebase/dhtmlxgantt.js"></script>
	<link rel="stylesheet" href="../../codebase/dhtmlxgantt.css">
	<link rel="stylesheet" href="../common/sample_toolbar.css">
	<script src="../common/sample_toolbar.js"></script>

	<script src="../common/testdata_public.js"></script>
	<style>
		html, body {
			height: 100%;
			padding: 0px;
			margin: 0px;
			overflow: hidden;
		}
	</style>
</head>

<body>

	<div id="gantt_here" style="width:100%; height:100%;"></div>

	<script>
		gantt.plugins({ toolbar: true });
		gantt.config.toolbar = [
			{ id: "info", label: "Info" },
			{ id: "warning", label: "Warning" },
			{ id: "error", label: "Error" }
		];
		gantt.attachEvent("onToolbarItemClick", function(id) {
			showMessage(id);
		});

		gantt.config.layout = withSampleToolbar(gantt.config.layout);
		gantt.init("gantt_here");
		gantt.parse(projects_with_milestones);

		var showMessage = function(type) {
			var text = "";
			var countTask = gantt.getTaskCount();
			var countLink = gantt.getLinkCount();
			var version   = gantt.version;

			text += "Tasks count: " + countTask + "<br>";
			text += "Links count: " + countLink + "<br>";
			text += "Gantt version: " + version;

			gantt.message({type:type, text:text, expire: 10000});

		}
		gantt.message.position = "bottom";
		gantt.message({text:"Click on the buttons to explore Gantt message types", expire:-1, type:"error"});
	</script>
</body>
